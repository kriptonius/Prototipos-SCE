<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab de Prototipos SALVATORE</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header {
      background-color: var(--bg-secondary);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    header span { font-size: 0.85rem; color: #94a3b8; }

    /* Layout */
    main { display: flex; flex: 1; height: calc(100vh - 65px); }

    /* Editor */
    .editor-panel {
      width: 40%;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.5rem;
    }
    .editor-panel label { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
    
    textarea {
      flex: 1;
      background-color: #090d16;
      color: #38bdf8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background-color: #4f46e5; transform: translateY(-1px); }

    /* Preview */
    .preview-panel {
      width: 60%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .preview-bar {
      background-color: #f1f5f9;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>Lab de Prototipos SALVATORE 🚀</h1>
    <span>Entorno de Validación con Clientes</span>
  </header>

  <main>
    <section class="editor-panel">
      <label>CÓDIGO DEL PROTOTIPO (HTML/CSS/JS)</label>
      <textarea id="code-input" placeholder="<html>&#10;  <style>body { font-family: sans-serif; }</style>&#10;  <body>&#10;    <h1>Tu Prototipo Aquí</h1>&#10;  </body>&#10;</html>"></textarea>
      <button onclick="renderPrototype()">Desplegar Prototipo ⚡</button>
    </section>

    <section class="preview-panel">
      <div class="preview-bar">Vista Previa Interactiva</div>
      <iframe id="sandbox-preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    </section>
  </main>

  <script>
    function renderPrototype() {
      const code = document.getElementById('code-input').value;
      const iframe = document.getElementById('sandbox-preview');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(code);
      iframeDoc.close();
    }
  </script>

</body>
</html>
