<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab de Prototipos SALVATORE 🚀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #1e293b;
    color: #e2e8f0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    flex-shrink: 0;
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: baseline;
    gap: 4px 16px; padding: 14px 20px;
    background: #1e293b;
    border-bottom: 3px solid #6366f1;
  }
  header h1 { font-size: 1.25rem; }
  header p  { color: #94a3b8; font-size: .95rem; }

  main { flex: 1; display: flex; min-height: 0; }

  .zone-codigo {
    width: 42%;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px; min-height: 0;
  }
  .zone-codigo h2 { font-size: .9rem; letter-spacing: .5px; color: #cbd5e1; }

  #codigo {
    flex: 1; min-height: 0;
    resize: none;
    background: #0b1120; color: #7dd3fc;
    border: 1px solid #334155; border-radius: 10px;
    padding: 12px;
    font: 13px/1.5 Consolas, Menlo, monospace;
    overflow: auto;
  }

  .acciones { flex-shrink: 0; }
  #run {
    width: 100%; padding: 14px;
    border: none; border-radius: 10px;
    background: #6366f1; color: #fff;
    font-size: 1rem; font-weight: bold;
    cursor: pointer;
  }
  #run:active { transform: translateY(1px); }

  .zone-preview {
    flex: 1; display: flex; flex-direction: column;
    min-height: 0; background: #f8fafc;
  }

  /* Barra de la vista previa con botones de expandir / cerrar */
  .barra-preview {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 10px 16px;
    background: #e8edf5; border-bottom: 1px solid #cbd5e1;
    color: #475569; font-size: .9rem; letter-spacing: 1px;
  }
  .botones-preview { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-icono {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: none; border-radius: 8px;
    background: #6366f1; color: #fff;
    cursor: pointer;
  }
  .btn-icono:hover { background: #4f46e5; }
  #btnCerrar { background: #ef4444; }
  #btnCerrar:hover { background: #dc2626; }
  .oculto { display: none; }

  #preview { flex: 1; width: 100%; border: none; background: #fff; min-height: 0; }

  /* ✅ MODO PANORÁMICO: la vista previa lo cubre todo */
  .zone-preview.expandida {
    position: fixed;
    inset: 0;
    z-index: 1000;
    animation: aparecer .25s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: scale(.98); }
    to   { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    .zone-codigo { width: 100%; height: 46%; }
    .zone-preview { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Lab de Prototipos SALVATORE 🚀</h1>
  <p>Entorno de Validación con Clientes</p>
</header>

<main>
  <section class="zone-codigo">
    <h2>CÓDIGO DEL PROTOTIPO (HTML/CSS/JS)</h2>
    <textarea id="codigo" spellcheck="false"></textarea>
    <div class="acciones">
      <button id="run">▶ EJECUTAR PROTOTIPO</button>
    </div>
  </section>

  <section class="zone-preview" id="zonePreview">
    <div class="barra-preview">
      <span>VISTA PREVIA INTERACTIVA</span>
      <span class="botones-preview">
        <button id="btnExpandir" class="btn-icono" title="Ver en pantalla completa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <button id="btnCerrar" class="btn-icono oculto" title="Volver al tamaño original">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </span>
    </div>
    <iframe id="preview" title="Vista previa"></iframe>
  </section>
</main>

<script>
  const prototipo = `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; background-color: #f4f4f9;
    }
    .btn-genial {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff; font-family: Arial, sans-serif;
      font-size: 16px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,75,43,0.4);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-genial:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,75,43,0.6); }
    .btn-genial:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <button class="btn-genial">GENIAL ENTRA YA</button>
</body>
</html>`;

  const area  = document.getElementById('codigo');
  const marco = document.getElementById('preview');

  area.value = prototipo;

  function ejecutar() {
    marco.srcdoc = area.value;
  }

  document.getElementById('run').addEventListener('click', ejecutar);
  ejecutar(); // auto-ejecuta al abrir

  /* ===== MODO PANORÁMICO ===== */
  const zona      = document.getElementById('zonePreview');
  const btnAbrir  = document.getElementById('btnExpandir');
  const btnCerrar = document.getElementById('btnCerrar');

  function modoPantalla(completa) {
    zona.classList.toggle('expandida', completa);
    btnAbrir.classList.toggle('oculto', completa);
    btnCerrar.classList.toggle('oculto', !completa);
  }

  function salir() {
    modoPantalla(false);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  btnAbrir.addEventListener('click', () => {
    modoPantalla(true);
    // Pantalla completa REAL (oculta barras del navegador);
    // si el dispositivo no lo soporta, el overlay CSS ya cubre todo
    if (zona.requestFullscreen) zona.requestFullscreen().catch(() => {});
  });

  btnCerrar.addEventListener('click', salir);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') salir(); });

  // Si el cliente sale con el botón "atrás" del sistema, también se repliega
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && zona.classList.contains('expandida')) {
      modoPantalla(false);
    }
  });
</script>
</body>
</html>
