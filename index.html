<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab de Prototipos SALVATORE 🚀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #1e293b;
    color: #e2e8f0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    flex-shrink: 0;
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: baseline;
    gap: 4px 16px; padding: 14px 20px;
    background: #1e293b;
    border-bottom: 3px solid #6366f1;
  }
  header h1 { font-size: 1.25rem; }
  header p  { color: #94a3b8; font-size: .95rem; }

  main { flex: 1; display: flex; min-height: 0; }

  .zone-codigo {
    width: 42%;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px; min-height: 0;
  }
  .zone-codigo h2 { font-size: .9rem; letter-spacing: .5px; color: #cbd5e1; }

  .modos { display: flex; gap: 8px; flex-shrink: 0; }
  .modo {
    flex: 1; padding: 10px 6px;
    border: 1px solid #334155; border-radius: 10px;
    background: #0b1120; color: #94a3b8;
    font-weight: bold; font-size: .82rem; cursor: pointer;
    white-space: nowrap;
  }
  .modo.activo { background: #6366f1; border-color: #6366f1; color: #fff; }

  #codigo {
    flex: 1; min-height: 0;
    resize: none;
    background: #0b1120; color: #7dd3fc;
    border: 1px solid #334155; border-radius: 10px;
    padding: 12px;
    font: 13px/1.5 Consolas, Menlo, monospace;
    overflow: auto;
  }

  .acciones { flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .acciones button {
    border: none; border-radius: 10px;
    font-weight: bold; cursor: pointer;
    white-space: nowrap;
  }
  .acciones button:active { transform: translateY(1px); }

  .fila-principal { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
  #run    { padding: 14px; background: #6366f1; color: #fff; font-size: 1rem; }
  #cargar { padding: 14px; background: #0ea5e9; color: #fff; font-size: .95rem; }

  .fila-guardado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .fila-guardado button { padding: 12px 4px; font-size: .88rem; }
  #guardarHtml { background: #10b981; color: #fff; }
  #guardarJson { background: #f59e0b; color: #fff; }
  #guardarJs   { background: #f7df1e; color: #1e293b; }

  .zone-preview {
    flex: 1; display: flex; flex-direction: column;
    min-height: 0; background: #f8fafc;
  }

  .barra-preview {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 10px 16px;
    background: #e8edf5; border-bottom: 1px solid #cbd5e1;
    color: #475569; font-size: .9rem; letter-spacing: 1px;
  }
  .botones-preview { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-icono {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: none; border-radius: 8px;
    background: #6366f1; color: #fff;
    cursor: pointer;
  }
  .btn-icono:hover { background: #4f46e5; }
  #btnCerrar { background: #ef4444; }
  #btnCerrar:hover { background: #dc2626; }
  .oculto { display: none; }

  #preview { flex: 1; width: 100%; border: none; background: #fff; min-height: 0; }

  .zone-preview.expandida {
    position: fixed;
    inset: 0;
    z-index: 1000;
    animation: aparecer .25s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: scale(.98); }
    to   { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    .zone-codigo { width: 100%; height: 55%; }
    .zone-preview { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Lab de Prototipos SALVATORE 🚀</h1>
  <p>Entorno de Validación con Clientes</p>
</header>

<main>
  <section class="zone-codigo">
    <h2>CÓDIGO DEL PROTOTIPO</h2>
    <div class="modos">
      <button id="modoHtml" class="modo activo">🌐 HTML / CSS / JS</button>
      <button id="modoReact" class="modo">⚛️ REACT (JSX)</button>
    </div>
    <textarea id="codigo" spellcheck="false"></textarea>
    <div class="acciones">
      <div class="fila-principal">
        <button id="run">▶ EJECUTAR</button>
        <button id="cargar">📂 CARGAR</button>
      </div>
      <div class="fila-guardado">
        <button id="guardarHtml">💾 HTML</button>
        <button id="guardarJson">💾 JSON</button>
        <button id="guardarJs">💾 JS</button>
      </div>
    </div>
    <input type="file" id="inputArchivo" accept=".html,.htm,.json,.js,.jsx,.css,.txt" hidden>
  </section>

  <section class="zone-preview" id="zonePreview">
    <div class="barra-preview">
      <span>VISTA PREVIA INTERACTIVA</span>
      <span class="botones-preview">
        <button id="btnExpandir" class="btn-icono" title="Ver en pantalla completa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <button id="btnCerrar" class="btn-icono oculto" title="Volver al tamaño original">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </span>
    </div>
    <iframe id="preview" title="Vista previa"></iframe>
  </section>
</main>

<script>
  /* ===== ejemplos por defecto ===== */
  const prototipo = `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; background-color: #f4f4f9;
    }
    .btn-genial {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff; font-family: Arial, sans-serif;
      font-size: 16px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,75,43,0.4);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-genial:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,75,43,0.6); }
    .btn-genial:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <button class="btn-genial">GENIAL ENTRA YA</button>
</body>
</html>`;

  /* ✅ Ejemplo React: el catálogo Salvatore CORREGIDO y funcionando */
  const ejemploReact = `// 🍝 Catálogo Salvatore con carrito — React corregido
const productos = [
  { id: 1, nombre: 'Pizza Margherita', precio: 32000 },
  { id: 2, nombre: 'Lasaña de la Casa', precio: 38000 },
  { id: 3, nombre: 'Tiramisú clásico', precio: 16000 }
];

const estilos = {
  pagina: { minHeight: '100vh', background: '#f4f4f9', fontFamily: 'Arial, sans-serif', padding: '20px', boxSizing: 'border-box' },
  tarjeta: { background: '#ffffff', borderRadius: 12, padding: 14, marginBottom: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' },
  botonMas: { background: '#10b981', color: '#fff', border: 'none', borderRadius: 8, width: 34, height: 34, fontSize: 18, fontWeight: 'bold', cursor: 'pointer' },
  botonMenos: { background: '#ef4444', color: '#fff', border: 'none', borderRadius: 8, width: 34, height: 34, fontSize: 18, fontWeight: 'bold', cursor: 'pointer' },
  botonPedido: { display: 'block', width: '100%', marginTop: 16, padding: '14px', border: 'none', borderRadius: 50, background: 'linear-gradient(135deg, #ff416c, #ff4b2b)', color: '#fff', fontSize: 16, fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px', cursor: 'pointer', boxShadow: '0 4px 15px rgba(255,75,43,0.4)' }
};

function CatalogoCliente() {
  const [carrito, setCarrito] = useState({});

  const agregarProducto = (id) => {
    setCarrito((prev) => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
  };

  const quitarProducto = (id) => {
    setCarrito((prev) => {
      const copia = { ...prev };
      if (copia[id] > 1) copia[id] = copia[id] - 1;
      else delete copia[id];
      return copia;
    });
  };

  const total = Object.keys(carrito).reduce((suma, id) => {
    const prod = productos.find((p) => p.id === Number(id));
    return suma + prod.precio * carrito[id];
  }, 0);

  const generarPedido = () => {
    if (total === 0) {
      alert('🛒 Tu carrito está vacío. Agrega productos primero.');
      return;
    }
    alert('✅ Pedido generado por $' + total.toLocaleString() + '\\n¡Gracias por preferir Salvatore! 🍝');
  };

  return (
    <div style={estilos.pagina}>
      <h1 style={{ textAlign: 'center', color: '#1e293b', marginBottom: 4 }}>🍝 Catálogo Salvatore</h1>
      <p style={{ textAlign: 'center', color: '#64748b', marginTop: 0, marginBottom: 18 }}>Toca + para agregar al pedido</p>

      {productos.map((p) => (
        <div key={p.id} style={estilos.tarjeta}>
          <div>
            <strong>{p.nombre}</strong>
            <div style={{ color: '#64748b', fontSize: 14 }}>$ {p.precio.toLocaleString()}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            {carrito[p.id] ? (
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <button style={estilos.botonMenos} onClick={() => quitarProducto(p.id)}>−</button>
                <strong>{carrito[p.id]}</strong>
              </span>
            ) : null}
            <button style={estilos.botonMas} onClick={() => agregarProducto(p.id)}>+</button>
          </div>
        </div>
      ))}

      <button style={estilos.botonPedido} onClick={generarPedido}>
        Generar Pedido{total > 0 ? ' · $' + total.toLocaleString() : ''}
      </button>
    </div>
  );
}`;

  const area  = document.getElementById('codigo');
  const marco = document.getElementById('preview');
  area.value = prototipo;

  /* ===== modo HTML / REACT ===== */
  let modoActual = 'html';
  const btnModoHtml  = document.getElementById('modoHtml');
  const btnModoReact = document.getElementById('modoReact');

  function fijarModo(modo) {
    modoActual = modo;
    btnModoHtml.classList.toggle('activo', modo === 'html');
    btnModoReact.classList.toggle('activo', modo === 'react');
  }

  function cambiarModo(modo) {
    if (modoActual === modo) return;
    if (modo === 'react' && area.value.trim() === prototipo.trim()) area.value = ejemploReact;
    else if (modo === 'html' && area.value.trim() === ejemploReact.trim()) area.value = prototipo;
    fijarModo(modo);
    ejecutar();
  }
  btnModoHtml.addEventListener('click', () => cambiarModo('html'));
  btnModoReact.addEventListener('click', () => cambiarModo('react'));

  /* ===== plantilla React robusta (multi-CDN + Babel + 🔧 auto-reparación mejorada) ===== */
  function plantillaReact(codigoCrudo) {
    let codigo = codigoCrudo;
    let nombreExport = '';

    const habiaImportReact = /import\s+[\s\S]*?from\s*['"]react['"]/.test(codigo);
    codigo = codigo.replace(/import\s+[\s\S]*?from\s*['"][^'"]+['"]\s*;?/g, '');
    codigo = codigo.replace(/import\s*['"][^'"]+['"]\s*;?/g, '');
    codigo = codigo.replace(/export\s+default\s+([A-Za-z_$][\w$]*)\s*;?/g, function (m, n) { nombreExport = n; return ''; });
    codigo = codigo.replace(/export\s+default\s+/g, '');
    codigo = codigo.replace(/export\s+(const|let|var|function|class)\s+/g, '$1 ');

    const usaHooksSueltos = habiaImportReact ||
      /(^|[^.\w])(useState|useEffect|useRef|useMemo|useCallback|useReducer|useContext)\s*\(/.test(codigo);
    if (usaHooksSueltos) {
      codigo = 'const { useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext, Fragment } = React;\n' + codigo;
    }

    const codigoSeguro = JSON.stringify(codigo).replace(/</g, '\\u003c');

    const montaje = `
;(function () {
  if (window.__REPARACIONES__ && window.__REPARACIONES__.length) {
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#fef3c7;color:#92400e;font:12px monospace;padding:6px 10px;border-bottom:1px solid #f59e0b';
    b.textContent = '🔧 Auto-corrección aplicada: ' + window.__REPARACIONES__.join(' | ');
    document.body.appendChild(b);
  }
  if (window.__MONTADO__) return;
  if (typeof ReactDOM === 'undefined') return;
  var candidato = null;
  var nombres = ['${nombreExport}', 'App', 'Componente', 'Prototipo', 'Demo', 'Main', 'Pantalla'].filter(Boolean);
  for (var i = 0; i < nombres.length; i++) {
    try {
      var v = (0, eval)(nombres[i]);
      if (typeof v === 'function' || (typeof v === 'object' && v !== null)) { candidato = v; break; }
    } catch (e) {}
  }
  if (!candidato) {
    var antes = window.__ANTES__ || [];
    for (var k in window) {
      if (antes.indexOf(k) === -1 && /^[A-Z]/.test(k) && typeof window[k] === 'function') { candidato = window[k]; break; }
    }
  }
  if (candidato) {
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(candidato));
  } else {
    window.__mostrarErrorProto('React cargado, pero no supe qué componente montar.\\nOpciones:\\n1) Nombra tu componente principal "App", o\\n2) Monta tú al final:\\n   ReactDOM.createRoot(document.getElementById("root")).render(<TuComponente />);', '#b45309', '#fef3c7');
  }
})();`;

    const montajeSeguro = JSON.stringify(montaje).replace(/</g, '\\u003c');

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; background: #f4f4f9; }
  #root { min-height: 100vh; }
  #cargando {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #f4f4f9; color: #6366f1;
    font-weight: bold; font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="cargando">⚛️ Cargando React…</div>
<script>
  window.__ANTES__   = Object.getOwnPropertyNames(window);
  window.__CODIGO__  = ${codigoSeguro};
  window.__MONTAJE__ = ${montajeSeguro};

  function mostrarErrorProto(msg, fg, bg) {
    var c = document.getElementById('cargando'); if (c) c.remove();
    var d = document.createElement('pre');
    d.style.cssText = 'color:' + (fg || '#dc2626') + ';background:' + (bg || '#fee2e2') +
      ';padding:14px;font-family:monospace;white-space:pre-wrap;position:fixed;inset:0;overflow:auto;margin:0;z-index:9999';
    d.textContent = msg;
    document.body.appendChild(d);
  }
  window.__mostrarErrorProto = mostrarErrorProto;

  window.addEventListener('error', function (e) {
    var extra = (e.message === 'Script error.')
      ? '\\n(error sin detalles: suele ser un CDN bloqueado por la red o un bloqueador)'
      : '';
    mostrarErrorProto('⚠️ Error en el prototipo React:\\n' + (e.message || e.error || 'Error desconocido') + extra);
  });

  /* 🔧 Mecánico: agrega "function" a líneas "Nombre() {" (con o sin sangría, nombre en mayúscula) */
  function autoReparar(code) {
    var reps = [];
    var lineas = code.split('\\n');
    for (var i = 0; i < lineas.length; i++) {
      var m = lineas[i].match(/^(\\s*)([A-Z][A-Za-z0-9_$]*)\\s*\\(([^{}]*)\\)\\s*\\{/);
      if (m) {
        lineas[i] = m[1] + 'function ' + lineas[i].slice(m[1].length);
        reps.push('faltaba "function" en ' + m[2]);
      }
    }
    return { codigo: lineas.join('\\n'), reparaciones: reps };
  }

  /* 🔧 Prueba: original → con "function" → con 1 a 3 llaves de cierre extra */
  function compilarConReparaciones(src) {
    var presets = { presets: ['env', 'react'] };
    try {
      return { out: Babel.transform(src, presets).code, reps: [], errorOriginal: null };
    } catch (err) {
      var rep = autoReparar(src);
      var candidatos = [rep.codigo];
      for (var extra = 1; extra <= 3; extra++) candidatos.push(rep.codigo + '\\n' + '}'.repeat(extra));
      for (var c = 0; c < candidatos.length; c++) {
        try {
          var out = Babel.transform(candidatos[c], presets).code;
          var reps = rep.reparaciones.slice();
          if (c > 0) reps.push('faltaban ' + c + ' llaves de cierre }');
          return { out: out, reps: reps, errorOriginal: err };
        } catch (e2) { /* sigue probando */ }
      }
      return { out: null, reps: [], errorOriginal: err };
    }
  }

  var LIBS = {
    react: [
      'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
      'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'
    ],
    reactdom: [
      'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
      'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'
    ],
    babel: [
      'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js',
      'https://unpkg.com/@babel/standalone@7.26.4/babel.min.js'
    ]
  };

  function cargar(urls, i, ok) {
    if (i >= urls.length) { ok(false); return; }
    var s = document.createElement('script');
    s.src = urls[i];
    s.crossOrigin = 'anonymous';
    s.onload  = function () { ok(true); };
    s.onerror = function () { s.remove(); cargar(urls, i + 1, ok); };
    document.head.appendChild(s);
  }

  var listo = false;
  setTimeout(function () {
    if (!listo && !document.querySelector('pre')) {
      mostrarErrorProto('⚠️ Los CDN de React/Babel no responden (conexión lenta o bloqueador).\\nPulsa ▶ EJECUTAR para reintentar.');
    }
  }, 20000);

  cargar(LIBS.react, 0, function (okR) {
    if (!okR) return mostrarErrorProto('⚠️ No se pudo descargar React desde ningún CDN.\\nRevisa tu conexión y pulsa ▶ EJECUTAR para reintentar.');
    cargar(LIBS.reactdom, 0, function (okD) {
      if (!okD) return mostrarErrorProto('⚠️ No se pudo descargar ReactDOM desde ningún CDN.\\nRevisa tu conexión y pulsa ▶ EJECUTAR para reintentar.');
      (function () {
        var origCreate = ReactDOM.createRoot.bind(ReactDOM);
        ReactDOM.createRoot = function (el) {
          window.__MONTADO__ = true;
          var c = document.getElementById('cargando'); if (c) c.remove();
          return origCreate(el);
        };
        if (ReactDOM.render) {
          var origRender = ReactDOM.render.bind(ReactDOM);
          ReactDOM.render = function (el, cont) {
            window.__MONTADO__ = true;
            var c = document.getElementById('cargando'); if (c) c.remove();
            return origRender(el, cont);
          };
        }
      })();
      cargar(LIBS.babel, 0, function (okB) {
        if (!okB) return mostrarErrorProto('⚠️ No se pudo descargar Babel desde ningún CDN.\\nRevisa tu conexión y pulsa ▶ EJECUTAR para reintentar.');
        listo = true;
        var c = document.getElementById('cargando'); if (c) c.remove();
        var res = compilarConReparaciones(window.__CODIGO__);
        if (!res.out) {
          return mostrarErrorProto('⚠️ Error de sintaxis en tu código JSX/JS:\\n' + res.errorOriginal.message);
        }
        window.__REPARACIONES__ = res.reps;
        var s = document.createElement('script');
        s.text = res.out + '\\n' + window.__MONTAJE__;
        document.body.appendChild(s);
      });
    });
  });
<\/script>
</body>
</html>`;
  }

  function ejecutar() {
    marco.srcdoc = (modoActual === 'react') ? plantillaReact(area.value) : area.value;
  }
  document.getElementById('run').addEventListener('click', ejecutar);
  ejecutar();

  /* ===== utilidades ===== */
  function feedback(btn, texto) {
    const original = btn.innerHTML;
    btn.innerHTML = texto;
    setTimeout(() => { btn.innerHTML = original; }, 1500);
  }

  function descargarArchivo(nombre, contenido, mime) {
    const blob = new Blob([contenido], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ===== 💾 GUARDADO MULTI-FORMATO ===== */
  function construirJson(nombre) {
    const crudo = area.value;
    try {
      const obj = JSON.parse(crudo);
      if (obj && typeof obj === 'object' && typeof obj.html === 'string') {
        obj.nombre = nombre;
        obj.fecha  = new Date().toISOString();
        obj.modo   = modoActual;
        return JSON.stringify(obj, null, 2);
      }
      return crudo;
    } catch (e) {
      return JSON.stringify({
        tipo:  'prototipo-salvatore',
        modo:  modoActual,
        nombre: nombre,
        fecha: new Date().toISOString(),
        html:  crudo
      }, null, 2);
    }
  }

  function guardarComo(ext, mime, btn) {
    let nombre = prompt('Nombre del archivo (sin extensión):', 'prototipo-salvatore');
    if (nombre === null) return;
    const base = nombre.trim().replace(/[\\/:*?"<>|]+/g, '-') || 'prototipo-salvatore';

    let contenido;
    if (ext === 'json') {
      contenido = construirJson(base);
    } else if (ext === 'html' && modoActual === 'react') {
      contenido = plantillaReact(area.value);
    } else {
      contenido = area.value;
      if (ext === 'js') {
        if (modoActual === 'react') {
          if (!confirm('ℹ️ Se guardará el JSX tal cual (necesita React/Babel para funcionar). ¿Continuar?')) return;
        } else if (/<\/?[a-z!]/i.test(contenido)) {
          if (!confirm('⚠️ El contenido parece HTML, no JavaScript. ¿Guardar de todos modos?')) return;
        }
      }
    }

    let archivo = base;
    if (!archivo.toLowerCase().endsWith('.' + ext)) archivo += '.' + ext;
    descargarArchivo(archivo, contenido, mime);
    feedback(btn, '✅ CREADO');
  }

  document.getElementById('guardarHtml').addEventListener('click', function () {
    guardarComo('html', 'text/html', this);
  });
  document.getElementById('guardarJson').addEventListener('click', function () {
    guardarComo('json', 'application/json', this);
  });
  document.getElementById('guardarJs').addEventListener('click', function () {
    guardarComo('js', 'text/javascript', this);
  });

  /* ===== 📂 CARGAR ARCHIVO ===== */
  const inputArchivo = document.getElementById('inputArchivo');
  const btnCargar    = document.getElementById('cargar');

  btnCargar.addEventListener('click', () => inputArchivo.click());

  inputArchivo.addEventListener('change', () => {
    const file = inputArchivo.files[0];
    if (!file) return;

    const lector = new FileReader();
    lector.onload = () => {
      let texto   = String(lector.result);
      let mensaje = '✅ CARGADO';

      if (/\.json$/i.test(file.name)) {
        try {
          const obj = JSON.parse(texto);
          if (obj && typeof obj === 'object' && typeof obj.html === 'string') {
            texto   = obj.html;
            mensaje = '✅ PROTOTIPO RESTAURADO';
            if (obj.modo === 'react' || obj.modo === 'html') fijarModo(obj.modo);
          }
        } catch (e) { /* JSON crudo */ }
      } else if (/\.jsx$/i.test(file.name)) {
        fijarModo('react');
      }

      area.value = texto;
      if (modoActual === 'react' || /<[a-z!]/i.test(texto)) ejecutar();
      feedback(btnCargar, mensaje);
      inputArchivo.value = '';
    };
    lector.readAsText(file);
  });

  /* ===== MODO PANORÁMICO ===== */
  const zona      = document.getElementById('zonePreview');
  const btnAbrir  = document.getElementById('btnExpandir');
  const btnCerrar = document.getElementById('btnCerrar');

  function modoPantalla(completa) {
    zona.classList.toggle('expandida', completa);
    btnAbrir.classList.toggle('oculto', completa);
    btnCerrar.classList.toggle('oculto', !completa);
  }
  function salir() {
    modoPantalla(false);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  btnAbrir.addEventListener('click', () => {
    modoPantalla(true);
    if (zona.requestFullscreen) zona.requestFullscreen().catch(() => {});
  });
  btnCerrar.addEventListener('click', salir);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') salir(); });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && zona.classList.contains('expandida')) {
      modoPantalla(false);
    }
  });
</script>
</body>
</html>
