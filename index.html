<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lab Salvatore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lab de Prototipos SALVATORE 🚀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #1e293b;
    color: #e2e8f0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    flex-shrink: 0;
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: baseline;
    gap: 4px 16px; padding: 14px 20px;
    background: #1e293b;
    border-bottom: 3px solid #6366f1;
  }
  header h1 { font-size: 1.25rem; }
  header p  { color: #94a3b8; font-size: .95rem; }

  main { flex: 1; display: flex; min-height: 0; }

  .zone-codigo {
    width: 42%;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px; min-height: 0;
  }
  .zone-codigo h2 { font-size: .9rem; letter-spacing: .5px; color: #cbd5e1; }

  #codigo {
    flex: 1; min-height: 0;
    resize: none;
    background: #0b1120; color: #7dd3fc;
    border: 1px solid #334155; border-radius: 10px;
    padding: 12px;
    font: 13px/1.5 Consolas, Menlo, monospace;
    overflow: auto;
  }

  /* Barra de botones */
  .acciones { flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .acciones button {
    border: none; border-radius: 10px;
    font-weight: bold; cursor: pointer;
    white-space: nowrap;
  }
  .acciones button:active { transform: translateY(1px); }

  .fila-principal { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
  #run    { padding: 14px; background: #6366f1; color: #fff; font-size: 1rem; }
  #cargar { padding: 14px; background: #0ea5e9; color: #fff; font-size: .95rem; }

  .fila-guardado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .fila-guardado button { padding: 12px 4px; font-size: .88rem; }
  #guardarHtml { background: #10b981; color: #fff; }
  #guardarJson { background: #f59e0b; color: #fff; }
  #guardarJs   { background: #f7df1e; color: #1e293b; }

  .zone-preview {
    flex: 1; display: flex; flex-direction: column;
    min-height: 0; background: #f8fafc;
  }

  .barra-preview {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 10px 16px;
    background: #e8edf5; border-bottom: 1px solid #cbd5e1;
    color: #475569; font-size: .9rem; letter-spacing: 1px;
  }
  .botones-preview { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-icono {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: none; border-radius: 8px;
    background: #6366f1; color: #fff;
    cursor: pointer;
  }
  .btn-icono:hover { background: #4f46e5; }
  #btnCerrar { background: #ef4444; }
  #btnCerrar:hover { background: #dc2626; }
  .oculto { display: none; }

  #preview { flex: 1; width: 100%; border: none; background: #fff; min-height: 0; }

  /* MODO PANORÁMICO */
  .zone-preview.expandida {
    position: fixed;
    inset: 0;
    z-index: 1000;
    animation: aparecer .25s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: scale(.98); }
    to   { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    .zone-codigo { width: 100%; height: 52%; }
    .zone-preview { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Lab de Prototipos SALVATORE 🚀</h1>
  <p>Entorno de Validación con Clientes</p>
</header>

<main>
  <section class="zone-codigo">
    <h2>CÓDIGO DEL PROTOTIPO (HTML/CSS/JS)</h2>
    <textarea id="codigo" spellcheck="false"></textarea>
    <div class="acciones">
      <div class="fila-principal">
        <button id="run">▶ EJECUTAR</button>
        <button id="cargar">📂 CARGAR</button>
      </div>
      <div class="fila-guardado">
        <button id="guardarHtml">💾 HTML</button>
        <button id="guardarJson">💾 JSON</button>
        <button id="guardarJs">💾 JS</button>
      </div>
    </div>
    <input type="file" id="inputArchivo" accept=".html,.htm,.json,.js,.css,.txt" hidden>
  </section>

  <section class="zone-preview" id="zonePreview">
    <div class="barra-preview">
      <span>VISTA PREVIA INTERACTIVA</span>
      <span class="botones-preview">
        <button id="btnExpandir" class="btn-icono" title="Ver en pantalla completa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <button id="btnCerrar" class="btn-icono oculto" title="Volver al tamaño original">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </span>
    </div>
    <iframe id="preview" title="Vista previa"></iframe>
  </section>
</main>

<script>
  const prototipo = `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; background-color: #f4f4f9;
    }
    .btn-genial {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff; font-family: Arial, sans-serif;
      font-size: 16px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,75,43,0.4);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-genial:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,75,43,0.6); }
    .btn-genial:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <button class="btn-genial">GENIAL ENTRA YA</button>
</body>
</html>`;

  const area  = document.getElementById('codigo');
  const marco = document.getElementById('preview');

  area.value = prototipo;

  function ejecutar() {
    marco.srcdoc = area.value;
  }
  document.getElementById('run').addEventListener('click', ejecutar);
  ejecutar(); // auto-ejecuta al abrir

  /* ===== utilidades ===== */
  function feedback(btn, texto) {
    const original = btn.innerHTML;
    btn.innerHTML = texto;
    setTimeout(() => { btn.innerHTML = original; }, 1500);
  }

  function descargarArchivo(nombre, contenido, mime) {
    const blob = new Blob([contenido], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ===== 💾 GUARDADO MULTI-FORMATO ===== */
  function construirJson(nombre) {
    const crudo = area.value;
    try {
      const obj = JSON.parse(crudo);
      // Si ya es un catálogo del Lab, actualiza nombre/fecha sin anidar
      if (obj && typeof obj === 'object' && typeof obj.html === 'string') {
        obj.nombre = nombre;
        obj.fecha  = new Date().toISOString();
        return JSON.stringify(obj, null, 2);
      }
      return crudo; // ya era JSON válido del usuario: se respeta tal cual
    } catch (e) {
      // No es JSON → lo empaqueta como catálogo de prototipo
      return JSON.stringify({
        tipo:  'prototipo-salvatore',
        nombre: nombre,
        fecha: new Date().toISOString(),
        html:  crudo
      }, null, 2);
    }
  }

  function guardarComo(ext, mime, btn) {
    let nombre = prompt('Nombre del archivo (sin extensión):', 'prototipo-salvatore');
    if (nombre === null) return; // canceló
    const base = nombre.trim().replace(/[\\/:*?"<>|]+/g, '-') || 'prototipo-salvatore';

    let contenido = area.value;

    if (ext === 'json') {
      contenido = construirJson(base); // siempre produce JSON válido
    } else if (ext === 'js' && /<\/?[a-z!]/i.test(contenido)) {
      if (!confirm('⚠️ El contenido parece HTML, no JavaScript.\n¿Guardar de todos modos?')) return;
    }

    let archivo = base;
    if (!archivo.toLowerCase().endsWith('.' + ext)) archivo += '.' + ext;

    descargarArchivo(archivo, contenido, mime);
    feedback(btn, '✅ CREADO');
  }

  document.getElementById('guardarHtml').addEventListener('click', function () {
    guardarComo('html', 'text/html', this);
  });
  document.getElementById('guardarJson').addEventListener('click', function () {
    guardarComo('json', 'application/json', this);
  });
  document.getElementById('guardarJs').addEventListener('click', function () {
    guardarComo('js', 'text/javascript', this);
  });

  /* ===== 📂 CARGAR ARCHIVO AL EDITOR ===== */
  const inputArchivo = document.getElementById('inputArchivo');
  const btnCargar    = document.getElementById('cargar');

  btnCargar.addEventListener('click', () => inputArchivo.click());

  inputArchivo.addEventListener('change', () => {
    const file = inputArchivo.files[0];
    if (!file) return;

    const lector = new FileReader();
    lector.onload = () => {
      let texto   = String(lector.result);
      let mensaje = '✅ CARGADO';

      // Si es un catálogo JSON del Lab, restaura el prototipo empaquetado
      if (/\.json$/i.test(file.name)) {
        try {
          const obj = JSON.parse(texto);
          if (obj && typeof obj === 'object' && typeof obj.html === 'string') {
            texto   = obj.html;
            mensaje = '✅ PROTOTIPO RESTAURADO';
          }
        } catch (e) { /* JSON crudo: se muestra tal cual */ }
      }

      area.value = texto;
      if (/<[a-z!]/i.test(texto)) ejecutar(); // si es HTML, lo muestra al instante
      feedback(btnCargar, mensaje);
      inputArchivo.value = '';
    };
    lector.readAsText(file);
  });

  /* ===== MODO PANORÁMICO ===== */
  const zona      = document.getElementById('zonePreview');
  const btnAbrir  = document.getElementById('btnExpandir');
  const btnCerrar = document.getElementById('btnCerrar');

  function modoPantalla(completa) {
    zona.classList.toggle('expandida', completa);
    btnAbrir.classList.toggle('oculto', completa);
    btnCerrar.classList.toggle('oculto', !completa);
  }
  function salir() {
    modoPantalla(false);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  btnAbrir.addEventListener('click', () => {
    modoPantalla(true);
    if (zona.requestFullscreen) zona.requestFullscreen().catch(() => {});
  });
  btnCerrar.addEventListener('click', salir);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') salir(); });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && zona.classList.contains('expandida')) {
      modoPantalla(false);
    }
  });

  /* ===== PWA: service worker ===== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
