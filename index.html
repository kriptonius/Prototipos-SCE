<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LeonVex Studio - Live Radio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-pink: #ff2d78;
    --neon-violet: #b14aed;
    --neon-cyan: #00f0ff;
    --neon-lime: #b4ff39;
    --neon-orange: #ff9500;
    --bg-dark: #05060a;
    --bg-panel: rgba(10, 12, 20, 0.92);
    --text-main: #e8ecff;
    --text-dim: #7a83a8;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 45, 120, 0.15), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.12), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(177, 74, 237, 0.08), transparent 60%);
    z-index: 0;
    animation: bgShift 20s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.3) rotate(10deg); }
  }

  .scroll-container {
    position: relative;
    z-index: 1;
    padding-bottom: 180px;
  }

  .player-container {
    width: min(95vw, 420px);
    margin: 40px auto;
    background: var(--bg-panel);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(177, 74, 237, 0.3);
    border-radius: 32px;
    padding: 32px 28px;
    box-shadow:
      0 0 80px rgba(255, 45, 120, 0.15),
      0 0 160px rgba(0, 240, 255, 0.08);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-violet), var(--neon-cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .status {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--neon-lime);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  .status::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--neon-lime);
    box-shadow: 0 0 12px var(--neon-lime);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .visualizer-wrap {
    position: relative;
    width: 100%;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 28px;
    background: radial-gradient(circle at center, #0d1220 0%, #05060a 100%);
    border: 1px solid rgba(0, 240, 255, 0.2);
  }

  canvas#visualizer {
    width: 100%;
    height: 100%;
    display: block;
  }

  .video-player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: none;
    z-index: 15;
  }

  .video-player.active {
    display: block;
  }

  .video-player video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .video-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid var(--neon-pink);
    color: var(--neon-pink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
  }

  .video-close-btn:hover {
    background: var(--neon-pink);
    color: white;
    transform: rotate(90deg);
  }

  .video-close-btn svg { width: 18px; height: 18px; }

  .now-playing {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .now-playing-info {
    background: rgba(0, 0, 0, 0.7);
    padding: 12px 18px;
    border-radius: 14px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .now-playing-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 3px;
  }

  .now-playing-genre {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .live-badge {
    background: var(--neon-pink);
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(255, 45, 120, 0.7);
    animation: livePulse 2s infinite;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
  }

  .live-badge.loading { background: var(--neon-violet); animation: none; }
  .live-badge.searching { background: var(--neon-cyan); animation: none; }
  .live-badge.error { background: #666; animation: none; }
  .live-badge.video { background: var(--neon-orange); animation: none; }

  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 45, 120, 0.7); }
    50% { box-shadow: 0 0 30px rgba(255, 45, 120, 1); }
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    margin-bottom: 20px;
  }

  .ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text-main);
    cursor: pointer;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .ctrl-btn:hover {
    color: var(--neon-cyan);
    transform: scale(1.1);
  }

  .ctrl-btn svg { width: 24px; height: 24px; }

  .play-btn {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
    box-shadow: 0 0 30px rgba(255, 45, 120, 0.6), 0 0 60px rgba(177, 74, 237, 0.3);
  }

  .play-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 0 40px rgba(255, 45, 120, 0.8), 0 0 80px rgba(177, 74, 237, 0.5);
  }

  .play-btn svg { width: 32px; height: 32px; }

  .action-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .action-btn {
    background: linear-gradient(135deg, rgba(177, 74, 237, 0.15), rgba(0, 240, 255, 0.15));
    border: 1px solid rgba(177, 74, 237, 0.3);
    border-radius: 14px;
    padding: 10px 6px;
    color: var(--text-main);
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .action-btn:hover {
    background: linear-gradient(135deg, rgba(177, 74, 237, 0.25), rgba(0, 240, 255, 0.25));
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    transform: translateY(-2px);
  }

  .action-btn svg { width: 18px; height: 18px; }

  .main-panel {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(5, 6, 10, 0.98);
    border-radius: 20px;
    z-index: 20;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }

  .main-panel.active {
    display: flex;
    flex-direction: column;
    animation: slideIn 0.4s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(177, 74, 237, 0.3);
    flex-shrink: 0;
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--neon-cyan);
  }

  .close-panel-btn {
    background: rgba(255, 45, 120, 0.2);
    border: 1px solid var(--neon-pink);
    color: var(--neon-pink);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .close-panel-btn:hover {
    background: var(--neon-pink);
    color: white;
    transform: rotate(90deg);
  }

  .close-panel-btn svg { width: 16px; height: 16px; }

  .tabs {
    display: flex;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
    overflow-x: auto;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1;
    min-width: 70px;
    padding: 12px 8px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tab.active { color: var(--neon-cyan); }

  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--neon-cyan);
    box-shadow: 0 0 10px var(--neon-cyan);
  }

  .tab:hover { color: var(--text-main); }

  .tab-content {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .tab-content.active { display: block; }

  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-track { background: transparent; }
  .tab-content::-webkit-scrollbar-thumb { background: rgba(177, 74, 237, 0.3); border-radius: 2px; }

  .list-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .list-item:hover {
    background: rgba(177, 74, 237, 0.1);
    border-color: rgba(177, 74, 237, 0.4);
    transform: translateX(4px);
  }

  .list-item-cover {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--neon-violet), var(--neon-pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: white;
    flex-shrink: 0;
    overflow: hidden;
  }

  .list-item-cover.video-cover {
    background: linear-gradient(135deg, var(--neon-orange), var(--neon-pink));
  }

  .list-item-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .list-item-info { flex: 1; min-width: 0; }

  .list-item-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 3px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-item-sub {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-item-play {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transition: all 0.3s ease;
  }

  .list-item:hover .list-item-play { opacity: 1; }
  .list-item-play svg { width: 14px; height: 14px; color: white; }

  .upload-zone {
    border: 2px dashed rgba(177, 74, 237, 0.4);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 16px;
    background: rgba(177, 74, 237, 0.05);
  }

  .upload-zone:hover {
    border-color: var(--neon-cyan);
    background: rgba(0, 240, 255, 0.05);
    transform: scale(1.02);
  }

  .upload-zone svg {
    width: 40px;
    height: 40px;
    color: var(--neon-cyan);
    margin-bottom: 10px;
    filter: drop-shadow(0 0 10px var(--neon-cyan));
  }

  .upload-zone-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 4px;
    color: var(--text-main);
  }

  .upload-zone-sub {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .search-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(177, 74, 237, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: all 0.3s ease;
  }

  .search-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
  }

  .search-input::placeholder { color: var(--text-dim); }

  .search-btn {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
    border: none;
    border-radius: 12px;
    width: 48px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .search-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 45, 120, 0.5);
  }

  .search-btn svg { width: 20px; height: 20px; color: white; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
  }

  .empty-state svg {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .radio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .radio-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .radio-card:hover {
    border-color: rgba(177, 74, 237, 0.4);
    transform: translateY(-3px);
  }

  .radio-card.active {
    border-color: var(--neon-cyan);
    background: rgba(0, 240, 255, 0.05);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
  }

  .radio-card.active::after {
    content: '';
    position: absolute;
    top: 14px;
    right: 14px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--neon-lime);
    box-shadow: 0 0 10px var(--neon-lime);
    animation: pulse 1.5s infinite;
  }

  .radio-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    margin-bottom: 14px;
    color: white;
  }

  .radio-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 5px;
    line-height: 1.3;
  }

  .radio-genre {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .radio-rpp .radio-icon { background: linear-gradient(135deg, #ff2d78, #ff6b9d); }
  .radio-inolvidable .radio-icon { background: linear-gradient(135deg, #b14aed, #d66bff); }
  .radio-nuevaq .radio-icon { background: linear-gradient(135deg, #ff9500, #ffb84d); }
  .radio-radiomar .radio-icon { background: linear-gradient(135deg, #00f0ff, #4dd0ff); }
  .radio-studio92 .radio-icon { background: linear-gradient(135deg, #b4ff39, #d4ff7f); }
  .radio-mod .radio-icon { background: linear-gradient(135deg, #ff2d78, #ff9500); }
  .radio-lazona .radio-icon { background: linear-gradient(135deg, #00f0ff, #b14aed); }

  .volume-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(180deg, transparent 0%, rgba(5, 6, 10, 0.95) 20%, rgba(5, 6, 10, 1) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 30px 20px 20px;
    border-top: 1px solid rgba(177, 74, 237, 0.2);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }

  .volume-wrap {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .volume-wrap svg {
    width: 24px;
    height: 24px;
    color: var(--neon-cyan);
    filter: drop-shadow(0 0 8px var(--neon-cyan));
  }

  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0, 240, 255, 0.5);
    cursor: pointer;
    transition: transform 0.2s;
  }

  .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .volume-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    min-width: 40px;
    text-align: right;
  }

  @media (max-width: 480px) {
    .player-container { padding: 24px 20px; margin: 20px auto; }
    .brand { font-size: 18px; }
    .visualizer-wrap { height: 240px; }
    .action-btn { font-size: 8px; padding: 8px 4px; }
  }
</style>
</head>
<body>

<div class="scroll-container">
  <div class="player-container">
    <div class="header">
      <div class="brand">LEONVEX STUDIO</div>
      <div class="status">LIVE</div>
    </div>

    <div class="visualizer-wrap" id="visualizerWrap">
      <canvas id="visualizer"></canvas>
      
      <div class="video-player" id="videoPlayer">
        <video id="videoElement" playsinline controls></video>
        <button class="video-close-btn" id="videoCloseBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="now-playing">
        <div class="now-playing-info">
          <div class="now-playing-title" id="nowTitle">RPP NOTICIAS</div>
          <div class="now-playing-genre" id="nowGenre">NOTICIAS</div>
        </div>
        <div class="live-badge" id="liveBadge">EN VIVO</div>
      </div>

      <div class="main-panel" id="mainPanel">
        <div class="panel-header">
          <div class="panel-title" id="panelTitle">EXPLORAR</div>
          <button class="close-panel-btn" id="closePanelBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="radios">📻 RADIOS</button>
          <button class="tab" data-tab="upload">🎵 MÚSICA</button>
          <button class="tab" data-tab="video">🎬 VIDEO</button>
          <button class="tab" data-tab="search">🔍 BUSCAR</button>
        </div>

        <div class="tab-content active" id="tab-radios">
          <div id="radioListContent">
            <div class="empty-state">CARGANDO RADIOS...</div>
          </div>
        </div>

        <div class="tab-content" id="tab-upload">
          <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
          <div class="upload-zone" id="uploadZone">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <div class="upload-zone-title">SUBIR MÚSICA</div>

        <div class="tab-content" id="tab-video">
          <input type="file" id="videoInput" accept="video/*" multiple style="display:none">

            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <div class="upload-zone-title">SUBIR VIDEO</div>
            <div class="upload-zone-sub">Toca para seleccionar videos</div>

              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>

            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              <div>Busca canciones en internet</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="action-btn" id="openRadiosBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        RADIOS
      </button>
      <button class="action-btn" id="openUploadBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        MÚSICA
      </button>
      <button class="action-btn" id="openVideoBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        VIDEO
      </button>
      <button class="action-btn" id="openSearchBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        BUSCAR
      </button>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="radio-grid" id="radioGrid"></div>
  </div>
</div>

<div class="volume-fixed">
  <div class="volume-wrap">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
    <div class="volume-label" id="volumeLabel">70%</div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script>
  const radios = [
    { id: 'rpp', name: 'RPP NOTICIAS', genre: 'Noticias', color: '#ff2d78', searchName: 'RPP' },
    { id: 'inolvidable', name: 'LA INOLVIDABLE', genre: 'Romántica / Clásicos', color: '#b14aed', searchName: 'La Inolvidable' },
    { id: 'nuevaq', name: 'NUEVA Q', genre: 'Tropical / Cumbia', color: '#ff9500', searchName: 'Nueva Q' },
    { id: 'radiomar', name: 'RADIOMAR', genre: 'Variada', color: '#00f0ff', searchName: 'Radiomar' },
    { id: 'studio92', name: 'STUDIO 92', genre: 'Pop / Urbano', color: '#b4ff39', searchName: 'Studio 92' },
    { id: 'moda', name: 'RADIO MODA', genre: 'Pop Internacional', color: '#ff2d78', searchName: 'Radio Moda' },
    { id: 'lazona', name: 'LA ZONA', genre: 'Pop / Rock', color: '#00f0ff', searchName: 'La Zona' }
  ];

  const audio = document.getElementById('audio');
  const videoElement = document.getElementById('videoElement');
  const videoPlayer = document.getElementById('videoPlayer');
  const videoCloseBtn = document.getElementById('videoCloseBtn');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeLabel = document.getElementById('volumeLabel');
  const nowTitle = document.getElementById('nowTitle');
  const nowGenre = document.getElementById('nowGenre');
  const liveBadge = document.getElementById('liveBadge');
  const radioGrid = document.getElementById('radioGrid');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');

  const mainPanel = document.getElementById('mainPanel');
  const panelTitle = document.getElementById('panelTitle');
  const closePanelBtn = document.getElementById('closePanelBtn');
  const openRadiosBtn = document.getElementById('openRadiosBtn');
  const openUploadBtn = document.getElementById('openUploadBtn');
  const openVideoBtn = document.getElementById('openVideoBtn');
  const openSearchBtn = document.getElementById('openSearchBtn');
  const fileInput = document.getElementById('fileInput');
  const uploadZone = document.getElementById('uploadZone');
  const localMusicList = document.getElementById('localMusicList');
  const videoInput = document.getElementById('videoInput');
  const videoUploadZone = document.getElementById('videoUploadZone');
  const localVideoList = document.getElementById('localVideoList');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const searchResults = document.getElementById('searchResults');
  const radioListContent = document.getElementById('radioListContent');

  let currentIndex = 0;
  let isPlaying = false;
  let allPeruRadios = [];
  let localTracks = [];
  let localVideos = [];
  let searchTracks = [];
  let currentSource = 'radio';
  let currentVideoIndex = -1;
  let radioCache = {};

  let audioCtx, analyser, source, dataArray;

  function initAudioContext() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      console.log('AudioContext inicializado');
    } catch (e) {
      console.error('Error inicializando AudioContext:', e);
    }
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    const w = canvas.width, h = canvas.height;
    const centerX = w / 2, centerY = h / 2;
    const maxRadius = Math.min(w, h) * 0.35;

    ctx.clearRect(0, 0, w, h);
    const bgGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius * 2);
    bgGrad.addColorStop(0, 'rgba(13, 18, 32, 0.3)');
    bgGrad.addColorStop(1, 'rgba(5, 6, 10, 0.8)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    if (!analyser || !isPlaying || currentSource === 'video') {
      drawIdleParticles(centerX, centerY, maxRadius);
      return;
    }

    analyser.getByteFrequencyData(dataArray);
    const bars = 128;
    const angleStep = (Math.PI * 2) / bars;
    const color = getCurrentColor();

    for (let ring = 0; ring < 3; ring++) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3 - ring * 0.1;
      ctx.shadowBlur = 20;
      ctx.shadowColor = color;
      const baseRadius = maxRadius * (0.5 + ring * 0.2);
      for (let i = 0; i < bars; i++) {
        const angle = i * angleStep;
        const dataIndex = Math.floor((i / bars) * dataArray.length);
        const amplitude = (dataArray[dataIndex] / 255) * (maxRadius * 0.3);
        const radius = baseRadius + amplitude;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    for (let i = 0; i < bars; i++) {
      const angle = i * angleStep;
      const dataIndex = Math.floor((i / bars) * dataArray.length);
      const amplitude = (dataArray[dataIndex] / 255);
      const radius = maxRadius * (0.6 + amplitude * 0.4);
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;
      const size = 2 + amplitude * 4;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.6 + amplitude * 0.4;
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius * 0.3);
    centerGlow.addColorStop(0, color);
    centerGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = centerGlow;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawIdleParticles(centerX, centerY, maxRadius) {
    const time = Date.now() / 1000;
    const color = getCurrentColor();
    const bars = 64;
    const angleStep = (Math.PI * 2) / bars;

    for (let i = 0; i < bars; i++) {
      const angle = i * angleStep + time * 0.2;
      const radius = maxRadius * (0.5 + Math.sin(time + i * 0.1) * 0.1);
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.4;
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.shadowBlur = 20;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.arc(centerX, centerY, maxRadius * 0.4 + Math.sin(time * 2) * 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function getCurrentColor() {
    if (currentSource === 'radio' && radios[currentIndex]) return radios[currentIndex].color;
    if (currentSource === 'local') return '#b4ff39';
    if (currentSource === 'video') return '#ff9500';
    if (currentSource === 'search') return '#ff9500';
    return '#00f0ff';
  }

  drawVisualizer();

  function showVideoPlayer() {
    videoPlayer.classList.add('active');
    canvas.style.display = 'none';
  }

  function hideVideoPlayer() {
    videoPlayer.classList.remove('active');
    canvas.style.display = 'block';
    videoElement.pause();
    videoElement.src = '';
    currentVideoIndex = -1;
  }

  videoCloseBtn.addEventListener('click', () => {
    hideVideoPlayer();
    currentSource = 'radio';
    liveBadge.textContent = 'EN VIVO';
    liveBadge.className = 'live-badge';
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    isPlaying = false;
  });

  function renderRadioGrid() {
    radioGrid.innerHTML = '';
    radios.forEach((radio, i) => {
      const card = document.createElement('div');
      card.className = `radio-card radio-${radio.id}${(i === currentIndex && currentSource === 'radio') ? ' active' : ''}`;
      card.innerHTML = `
        <div class="radio-icon">${radio.name.charAt(0)}</div>
        <div class="radio-name">${radio.name}</div>
        <div class="radio-genre">${radio.genre}</div>
      `;
      card.addEventListener('click', () => loadRadio(i, true));
      radioGrid.appendChild(card);
    });
  }

  function openPanel(tab = 'radios') {
    mainPanel.classList.add('active');
    switchTab(tab);
    if (tab === 'radios' && allPeruRadios.length === 0) loadPeruRadios();
  }

  function closePanel() {
    mainPanel.classList.remove('active');
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');

    const titles = { 
      radios: '📻 RADIOS PERÚ', 
      upload: ' MI MÚSICA', 
      video: '🎬 MIS VIDEOS', 
      search: '🔍 BUSCAR EN INTERNET' 
    };
    panelTitle.textContent = titles[tab];
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  openRadiosBtn.addEventListener('click', () => openPanel('radios'));
  openUploadBtn.addEventListener('click', () => openPanel('upload'));
  openVideoBtn.addEventListener('click', () => openPanel('video'));
  openSearchBtn.addEventListener('click', () => openPanel('search'));
  closePanelBtn.addEventListener('click', closePanel);

  uploadZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.style.borderColor = 'var(--neon-cyan)';
    uploadZone.style.background = 'rgba(0, 240, 255, 0.1)';
  });
  uploadZone.addEventListener('dragleave', () => {
    uploadZone.style.borderColor = '';
    uploadZone.style.background = '';
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.style.borderColor = '';
    uploadZone.style.background = '';
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    if (!files || files.length === 0) return;
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('audio/')) return;
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      localTracks.push({
        name: name.toUpperCase(),
        artist: 'LOCAL',
        url: url,
        fileName: file.name
      });
    });
    renderLocalMusic();
    console.log('Música cargada:', localTracks.length, 'tracks');
  }

  function renderLocalMusic() {
    if (localTracks.length === 0) {
      localMusicList.innerHTML = '<div class="empty-state">No hay música local aún</div>';
      return;
    }
    localMusicList.innerHTML = '';
    localTracks.forEach((track, i) => {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <div class="list-item-cover">♪</div>
        <div class="list-item-info">
          <div class="list-item-name">${track.name}</div>
          <div class="list-item-sub">ARCHIVO LOCAL</div>
        </div>
        <div class="list-item-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      `;
      item.addEventListener('click', () => playLocalTrack(i));
      localMusicList.appendChild(item);
    });
  }

  function playLocalTrack(index) {
    console.log('Reproduciendo track local:', index);
    currentSource = 'local';
    currentIndex = index;
    hideVideoPlayer();
    const track = localTracks[index];
    audio.src = track.url;
    nowTitle.textContent = track.name;
    nowGenre.textContent = 'MÚSICA LOCAL';
    liveBadge.textContent = 'EN VIVO';
    liveBadge.className = 'live-badge';
    isPlaying = false;
    play();
  }

  renderLocalMusic();

  videoUploadZone.addEventListener('click', () => videoInput.click());
  videoInput.addEventListener('change', (e) => handleVideoFiles(e.target.files));

  videoUploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    videoUploadZone.style.borderColor = 'var(--neon-orange)';
    videoUploadZone.style.background = 'rgba(255, 149, 0, 0.1)';
  });
  videoUploadZone.addEventListener('dragleave', () => {
    videoUploadZone.style.borderColor = '';
    videoUploadZone.style.background = '';
  });
  videoUploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    videoUploadZone.style.borderColor = '';
    videoUploadZone.style.background = '';
    handleVideoFiles(e.dataTransfer.files);
  });

  function handleVideoFiles(files) {
    if (!files || files.length === 0) return;
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('video/')) return;
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      localVideos.push({
        name: name.toUpperCase(),
        artist: 'VIDEO LOCAL',
        url: url,
        fileName: file.name,
        type: file.type
      });
    });
    renderLocalVideos();
    console.log('Videos cargados:', localVideos.length);
  }

  function renderLocalVideos() {
    if (localVideos.length === 0) {
      localVideoList.innerHTML = '<div class="empty-state">No hay videos aún</div>';
      return;
    }
    localVideoList.innerHTML = '';
    localVideos.forEach((video, i) => {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <div class="list-item-cover video-cover">▶</div>
        <div class="list-item-info">
          <div class="list-item-name">${video.name}</div>
          <div class="list-item-sub">${video.type || 'VIDEO'}</div>
        </div>
        <div class="list-item-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      `;
      item.addEventListener('click', () => playLocalVideo(i));
      localVideoList.appendChild(item);
    });
  }

  function playLocalVideo(index) {
    console.log('Reproduciendo video:', index);
    if (index < 0 || index >= localVideos.length) {
      console.error('Índice de video inválido:', index);
      return;
    }
    
    currentSource = 'video';
    currentVideoIndex = index;
    const video = localVideos[index];
    
    audio.pause();
    audio.src = '';
    isPlaying = false;
    
    showVideoPlayer();
    videoElement.src = video.url;
    
    nowTitle.textContent = video.name;
    nowGenre.textContent = 'VIDEO LOCAL';
    liveBadge.textContent = '▶ VIDEO';
    liveBadge.className = 'live-badge video';
    
    videoElement.play().then(() => {
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      console.log('Video reproduciéndose');
    }).catch(err => {
      console.error('Error al reproducir video:', err);
      liveBadge.textContent = 'ERROR';
      liveBadge.className = 'live-badge error';
    });
    
    closePanel();
  }

  videoElement.addEventListener('play', () => {
    isPlaying = true;
    playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  });

  videoElement.addEventListener('pause', () => {
    isPlaying = false;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  });

  videoElement.addEventListener('ended', () => {
    console.log('Video terminado, siguiente...');
    if (currentSource === 'video' && localVideos.length > 0) {
      const nextIndex = (currentVideoIndex + 1) % localVideos.length;
      playLocalVideo(nextIndex);
    }
  });

  videoElement.addEventListener('error', (e) => {
    console.error('Error de video:', e);
    liveBadge.textContent = 'ERROR';
    liveBadge.className = 'live-badge error';
  });

  renderLocalVideos();

  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doSearch();
  });

  async function doSearch() {
    const query = searchInput.value.trim();
    if (!query) return;

    searchResults.innerHTML = '<div class="empty-state">BUSCANDO...</div>';

    try {
      const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=30`);
      const data = await response.json();

      if (data.results.length === 0) {
        searchResults.innerHTML = '<div class="empty-state">Sin resultados</div>';
        return;
      }

      searchTracks = data.results.map(r => ({
        name: r.trackName.toUpperCase(),
        artist: r.artistName.toUpperCase(),
        url: r.previewUrl,
        cover: r.artworkUrl100.replace('100x100', '300x300')
      }));

      renderSearchResults();
    } catch (error) {
      console.error('Error en búsqueda:', error);
      searchResults.innerHTML = '<div class="empty-state">ERROR DE CONEXIÓN</div>';
    }
  }

  function renderSearchResults() {
    searchResults.innerHTML = '';
    searchTracks.forEach((track, i) => {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <div class="list-item-cover">
          ${track.cover ? `<img src="${track.cover}" alt="">` : '♪'}
        </div>
        <div class="list-item-info">
          <div class="list-item-name">${track.name}</div>
          <div class="list-item-sub">${track.artist}</div>
        </div>
        <div class="list-item-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      `;
      item.addEventListener('click', () => playSearchTrack(i));
      searchResults.appendChild(item);
    });
  }

  function playSearchTrack(index) {
    console.log('Reproduciendo búsqueda:', index);
    currentSource = 'search';
    hideVideoPlayer();
    const track = searchTracks[index];
    audio.src = track.url;
    nowTitle.textContent = track.name;
    nowGenre.textContent = track.artist;
    liveBadge.textContent = 'EN VIVO';
    liveBadge.className = 'live-badge';
    isPlaying = false;
    play();
    closePanel();
  }

  async function loadPeruRadios() {
    try {
      const response = await fetch('https://de1.api.radio-browser.info/json/stations/bycountry/Peru');
      const data = await response.json();
      allPeruRadios = data
        .filter(radio => radio.url_resolved && radio.name)
        .sort((a, b) => (b.clickcount || 0) - (a.clickcount || 0))
        .slice(0, 100);
      renderRadioList();
    } catch (error) {
      console.error('Error cargando radios:', error);
      radioListContent.innerHTML = '<div class="empty-state">ERROR AL CARGAR</div>';
    }
  }

  function renderRadioList() {
    radioListContent.innerHTML = '';
    allPeruRadios.forEach((radio, index) => {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.innerHTML = `
        <div class="list-item-cover">${String(index + 1).padStart(2, '0')}</div>
        <div class="list-item-info">
          <div class="list-item-name">${radio.name.toUpperCase()}</div>
          <div class="list-item-sub">${radio.tags || 'VARIADO'}</div>
        </div>
        <div class="list-item-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      `;
      item.addEventListener('click', () => playExternalRadio(radio));
      radioListContent.appendChild(item);
    });
  }

  function playExternalRadio(radio) {
    console.log('Reproduciendo radio externa:', radio.name);
    currentSource = 'radio';
    hideVideoPlayer();
    audio.src = radio.url_resolved;
    nowTitle.textContent = radio.name.toUpperCase();
    nowGenre.textContent = radio.tags || 'VARIADO';
    liveBadge.textContent = 'EN VIVO';
    liveBadge.className = 'live-badge';
    isPlaying = false;
    play();
    closePanel();
  }

  async function findRadioUrl(searchName) {
    if (radioCache[searchName]) return radioCache[searchName];
    try {
      const response = await fetch(`https://de1.api.radio-browser.info/json/stations/byname/${encodeURIComponent(searchName)}`);
      const data = await response.json();
      const peruStations = data.filter(s => s.countrycode === 'PE' && s.url_resolved && s.name.toLowerCase().includes(searchName.toLowerCase()));
      if (peruStations.length > 0) {
        const best = peruStations.sort((a, b) => (b.clickcount || 0) - (a.clickcount || 0))[0];
        radioCache[searchName] = best.url_resolved;
        return best.url_resolved;
      }
      const all = data.filter(s => s.url_resolved && s.name.toLowerCase().includes(searchName.toLowerCase()));
      if (all.length > 0) {
        const best = all.sort((a, b) => (b.clickcount || 0) - (a.clickcount || 0))[0];
        radioCache[searchName] = best.url_resolved;
        return best.url_resolved;
      }
      return null;
    } catch (error) {
      console.error('Error buscando radio:', error);
      return null;
    }
  }

  function setLoading(loading) {
    if (loading) {
      liveBadge.textContent = 'CARGANDO...';
      liveBadge.className = 'live-badge loading';
    } else if (isPlaying) {
      liveBadge.textContent = 'EN VIVO';
      liveBadge.className = 'live-badge';
    }
  }

  function setSearching() {
    liveBadge.textContent = 'BUSCANDO...';
    liveBadge.className = 'live-badge searching';
  }

  function setError() {
    liveBadge.textContent = 'OFFLINE';
    liveBadge.className = 'live-badge error';
  }

  async function loadRadio(index, autoplay = false) {
    currentIndex = (index + radios.length) % radios.length;
    const radio = radios[currentIndex];
    nowTitle.textContent = radio.name;
    nowGenre.textContent = radio.genre;
    currentSource = 'radio';
    hideVideoPlayer();
    renderRadioGrid();
    if (autoplay) {
      setSearching();
      const url = await findRadioUrl(radio.searchName);
      if (url) {
        audio.src = url;
        play();
      } else {
        setError();
      }
    }
  }

  function play() {
    initAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    setLoading(true);
    audio.play().then(() => {
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      setLoading(false);
      console.log('Audio reproduciéndose');
    }).catch(err => {
      console.error('Error al reproducir audio:', err);
      setError();
    });
  }

  function pause() {
    if (currentSource === 'video') {
      videoElement.pause();
    } else {
      audio.pause();
    }
    isPlaying = false;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    liveBadge.textContent = 'PAUSADO';
    liveBadge.className = 'live-badge error';
  }

  playBtn.addEventListener('click', () => {
    console.log('Play/Pause clicked, source:', currentSource);
    if (currentSource === 'video') {
      if (videoElement.paused) {
        videoElement.play();
      } else {
        videoElement.pause();
      }
    } else {
      if (isPlaying) pause(); else play();
    }
  });

  prevBtn.addEventListener('click', () => {
    console.log('Prev clicked, source:', currentSource);
    if (currentSource === 'video' && localVideos.length > 0) {
      const newIndex = (currentVideoIndex - 1 + localVideos.length) % localVideos.length;
      playLocalVideo(newIndex);
    } else if (currentSource === 'radio') {
      loadRadio(currentIndex - 1, isPlaying);
    } else if (currentSource === 'local' && localTracks.length > 0) {
      const newIndex = (currentIndex - 1 + localTracks.length) % localTracks.length;
      playLocalTrack(newIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    console.log('Next clicked, source:', currentSource);
    if (currentSource === 'video' && localVideos.length > 0) {
      const newIndex = (currentVideoIndex + 1) % localVideos.length;
      playLocalVideo(newIndex);
    } else if (currentSource === 'radio') {
      loadRadio(currentIndex + 1, isPlaying);
    } else if (currentSource === 'local' && localTracks.length > 0) {
      const newIndex = (currentIndex + 1) % localTracks.length;
      playLocalTrack(newIndex);
    }
  });

  volumeSlider.addEventListener('input', (e) => {
    const vol = e.target.value;
    audio.volume = vol;
    videoElement.volume = vol;
    volumeLabel.textContent = Math.round(vol * 100) + '%';
  });
  audio.volume = 0.7;
  videoElement.volume = 0.7;

  audio.addEventListener('error', (e) => {
    console.error('Error de audio:', e);
    setError();
  });

  audio.addEventListener('waiting', () => setLoading(true));
  audio.addEventListener('playing', () => {
    setLoading(false);
    console.log('Audio playing event');
  });

  async function preloadRadios() {
    for (const radio of radios) await findRadioUrl(radio.searchName);
  }

  preloadRadios();
  renderRadioGrid();
  loadRadio(0);
</script>
</body>
</html>
